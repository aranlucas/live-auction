              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auctions/{auctionId}/bids:
    post:
      summary: Place a bid
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,100}$
            example: vintage-camera-2026
          required: true
          name: auctionId
          in: path
        - schema:
            type: string
            pattern: ^Bearer [^\s]+$
          required: true
          name: authorization
          in: header
        - schema:
            type: string
            pattern: ^[\x21-\x7E]{1,200}$
            example: bid-018f4e9f
          required: true
          name: idempotency-key
          in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BidInput"
      responses:
        "200":
          description: Bid accepted or replayed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CommandSuccess"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role or auction ownership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Auction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Auction state conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /v1/auctions/{auctionId}/events:
    get:
      summary: Connect to sharded realtime updates
      description: Use WebSocket subprotocols auction.v1 and auth.<JWT>. Reconnect with afterSequence to
        receive bounded catch-up events in the snapshot.
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: string
            pattern: ^[A-Za-z0-9_-]{1,100}$
            example: vintage-camera-2026
          required: true
          name: auctionId
          in: path
        - schema:
            type:
              - number
              - "null"
          required: false
          name: afterSequence
          in: query
      responses:
        "101":
          description: WebSocket upgraded; messages conform to RealtimeMessage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RealtimeMessage"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Missing or invalid access token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Insufficient role or auction ownership
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Auction not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Auction state conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: Request body too large
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limit exceeded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "500":
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
webhooks: {}
