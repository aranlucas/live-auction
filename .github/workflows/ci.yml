name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint && pnpm format:check && pnpm openapi:check

      - name: Test
        run: pnpm test

      - name: Build web, render tests, and dry run
        run: pnpm --filter gavel-live-web build && pnpm --filter gavel-live-web test:render && pnpm --filter gavel-live-web exec cf deploy --prebuilt --dry-run --mode production

      - name: Worker deploy dry run
        run: pnpm deploy:dry-run

      - name: Check patch hygiene
        run: git diff --check

  e2e:
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        version: [fixed, cents-before, storage-before, currency-before]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
      - name: Typecheck browser harness
        run: pnpm exec tsc --noEmit --target esnext --module esnext --moduleResolution bundler --skipLibCheck e2e.config.ts e2e/auction.e2e.ts
      - name: Install Chromium
        run: pnpm exec e2e-web install chromium --with-deps
      - name: Restore only the defective component for CI reproduction
        if: matrix.version != 'fixed'
        env:
          VERSION: ${{ matrix.version }}
        run: |
          case "$VERSION" in
            cents-before) files="auction-panel.tsx" ;;
            storage-before) files="auction-room-page.tsx" ;;
            currency-before) files="activity-feed.tsx event-ledger.tsx" ;;
          esac
          for file in $files; do
            git show fe344c9:apps/web/src/components/"$file" > apps/web/src/components/"$file"
          done
      - name: Start isolated Worker
        run: |
          mkdir -p .e2e/logs
          pnpm exec vite --host 127.0.0.1 --port 8787 --strictPort --mode e2e > .e2e/logs/worker.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:8787/health; then exit 0; fi
            sleep 1
          done
          cat .e2e/logs/worker.log
          exit 1
      - name: Real browser to Worker journey
        if: matrix.version == 'fixed'
        run: pnpm exec e2e run
      - name: Demonstrate the original behavior fails its regression
        if: matrix.version != 'fixed'
        env:
          VERSION: ${{ matrix.version }}
        run: |
          pattern="EUR$"
          expected="10.25"
          if [ "$VERSION" = storage-before ]; then pattern="blocked storage"; expected="/auctions/"; fi
          if [ "$VERSION" = currency-before ]; then expected="€10.25"; fi
          set +e
          pnpm exec e2e run --grep "$pattern" > .e2e/reproduction.log 2>&1
          result=$?
          set -e
          cat .e2e/reproduction.log
          test "$result" -eq 1
          grep -F "$expected" .e2e/reproduction.log
      - name: Upload browser and Worker evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-evidence-${{ matrix.version }}
          path: .e2e
          include-hidden-files: true
          retention-days: 7
