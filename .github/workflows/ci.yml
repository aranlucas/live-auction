name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm, Node.js, and dependencies
        uses: pnpm/setup@fbda4c85fc2e1e08721cd8763afea8f48d60f024 # v3.0.0
        with:
          cache: true
          require-lockfile: true

      - parallel:
          - name: Typecheck
            run: pnpm types:check && pnpm typecheck

          - name: Lint
            run: pnpm lint && pnpm format:check && pnpm openapi:check

          - name: Test
            run: pnpm test

          - name: Build web, render tests, and dry run
            run: pnpm --filter gavel-live-web build && pnpm --filter gavel-live-web test:render && pnpm --filter gavel-live-web deploy:dry-run

          - name: Worker deploy dry run
            run: pnpm deploy:dry-run

      - name: Check patch hygiene
        run: git diff --check
